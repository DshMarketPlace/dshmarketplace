name: Sync catalogue

on:
  schedule:
    # 03:00 Asia/Shanghai. Late enough that a day's new plugins exist, early
    # enough that the numbers on the site are right before anyone reads them.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "How many listings to re-read from the GitHub API"
        default: "400"
      prune:
        description: "Re-apply the admission bar to existing topic rows"
        type: boolean
        default: true

# Two syncs writing the same rows is not a race worth having, and a queued run
# has nothing to add that the next scheduled one will not.
concurrency:
  group: sync-catalogue
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # The built-in token is capped at 1,000 API requests an hour, which a full
      # refresh passes before it finishes. Set SYNC_GITHUB_TOKEN to a PAT for
      # the usual 5,000; without it the run still completes, just slower.
      GITHUB_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Discovery walks both topics past the search API's 1,000-result ceiling
      # and admits only what clears the bar. Already-known repositories are
      # skipped, so a daily run costs a fraction of the first one.
      - name: Discover new plugins
        run: pnpm tsx scripts/ingest-topic.ts

      # A listing that was fine last month can stop being one: the repository
      # goes away, or gets archived. Re-reading the oldest-synced rows first
      # means the whole catalogue cycles without any run being expensive.
      - name: Refresh listing metadata
        run: pnpm tsx scripts/sync-github.ts ${{ inputs.refresh || '400' }}

      # `sync-github.ts` verifies the npm name on every row it touches, but it
      # only touches 400 a night. That guard was live for a fortnight and still
      # never reached the backlog: 412 of 852 listings were serving a command
      # for a package that was never published, or was somebody else's. A
      # correct check nothing sweeps with is not a check. This one is cheap —
      # a HEAD per distinct name — so it runs over the whole catalogue.
      - name: Verify every npm claim
        run: pnpm tsx scripts/repair-npm-claims.ts

      - name: Re-apply the admission bar
        if: ${{ inputs.prune != 'false' }}
        run: pnpm tsx scripts/prune-topic.ts

  # The catalogue counts are baked into prerendered pages, so a sync that does
  # not redeploy leaves the site quoting yesterday's numbers.
  deploy:
    needs: sync
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
