name: Sync catalogue

on:
  schedule:
    # 03:00 Asia/Shanghai. Late enough that a day's new plugins exist, early
    # enough that the numbers on the site are right before anyone reads them.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "How many listings to re-read from the GitHub API"
        default: "400"
      prune:
        description: "Re-apply the admission bar to existing topic rows"
        type: boolean
        default: true
      validate:
        description: "How many listings to install in the sandbox (0 skips it)"
        default: "150"
      reviews:
        description: "How many reviews to write afterwards"
        default: "40"

# Two syncs writing the same rows is not a race worth having, and a queued run
# has nothing to add that the next scheduled one will not.
concurrency:
  group: sync-catalogue
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # The built-in token is capped at 1,000 API requests an hour, which a full
      # refresh passes before it finishes. Set SYNC_GITHUB_TOKEN to a PAT for
      # the usual 5,000; without it the run still completes, just slower.
      GITHUB_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Discovery walks both topics past the search API's 1,000-result ceiling
      # and admits only what clears the bar. Already-known repositories are
      # skipped, so a daily run costs a fraction of the first one.
      - name: Discover new plugins
        run: pnpm tsx scripts/ingest-topic.ts

      # A listing that was fine last month can stop being one: the repository
      # goes away, or gets archived. Re-reading the oldest-synced rows first
      # means the whole catalogue cycles without any run being expensive.
      # Discovery records a listing but does not read its README, and the
      # refresh below runs oldest-synced first — which puts a plugin admitted
      # tonight dead last, six nights from its first read. Nothing downstream
      # works without a README: no review is written, and the newest entries,
      # the ones worth arriving for, would be the emptiest. So they go first.
      - name: Fetch READMEs for listings that have never had one
        run: pnpm tsx scripts/sync-github.ts --missing-readme 300

      - name: Refresh listing metadata
        run: pnpm tsx scripts/sync-github.ts ${{ inputs.refresh || '400' }}

      # `sync-github.ts` verifies the npm name on every row it touches, but it
      # only touches 400 a night. That guard was live for a fortnight and still
      # never reached the backlog: 412 of 852 listings were serving a command
      # for a package that was never published, or was somebody else's. A
      # correct check nothing sweeps with is not a check. This one is cheap —
      # a HEAD per distinct name — so it runs over the whole catalogue.
      - name: Verify every npm claim
        run: pnpm tsx scripts/repair-npm-claims.ts

      - name: Re-apply the admission bar
        if: ${{ inputs.prune != 'false' }}
        run: pnpm tsx scripts/prune-topic.ts

      # Which listings still need running is a database question, so it is
      # answered here, where the credentials already are. The answer crosses
      # to the sandbox as a plain file.
      - name: Export what still needs an install check
        run: |
          pnpm tsx scripts/export-validation-specs.ts \
            --limit ${{ inputs.validate || '150' }} > specs.jsonl
          echo "count=$(wc -l < specs.jsonl)" >> "$GITHUB_OUTPUT"
        id: specs

      - uses: actions/upload-artifact@v4
        with:
          name: validation-specs
          path: specs.jsonl
          retention-days: 1

    outputs:
      specs: ${{ steps.specs.outputs.count }}

  # Runs other people's install scripts, so it holds no secrets at all — not
  # the database token, not the review key. That is the whole reason it is a
  # separate job: a postinstall that can reach TURSO_AUTH_TOKEN owns the
  # catalogue. Nothing here can be stolen, because nothing here is secret.
  validate:
    needs: sync
    if: ${{ needs.sync.outputs.specs != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      # Checkout before the download: it cleans the path it writes to, and the
      # spec file must not be standing there when it does.
      - name: Fetch the validator
        uses: actions/checkout@v4
        with:
          repository: DshMarketPlace/dsh-plugin-validator
          path: validator

      - uses: actions/download-artifact@v4
        with:
          name: validation-specs

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # One throwaway container per plugin: non-root, every capability
      # dropped, memory and pids capped, no host mount. `dsh plugin add`
      # exits 0 even when it installed nothing, so the verdict comes from
      # the profile manifest the harness writes, never from an exit code.
      - name: Install every plugin
        working-directory: validator
        run: |
          docker build -t dsh-validator .
          node run.mjs ../specs.jsonl ../results.jsonl 3

      - uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: results.jsonl
          retention-days: 7

  # Back on the trusted side. Never runs a plugin, only reads what happened.
  apply:
    needs: [sync, validate]
    if: ${{ always() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
      REVIEW_API_BASE: ${{ secrets.REVIEW_API_BASE }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: validation-results

      # Drops any verdict whose command changed while the batch was running.
      - name: Record what happened
        run: pnpm tsx scripts/apply-validations.ts results.jsonl

      # A review is only ours because it carries the install result, so it is
      # written after the verdict lands and regenerates whenever the verdict
      # moves. Skipped when no key is configured rather than failing the run.
      - name: Write the reviews
        if: ${{ env.REVIEW_API_KEY != '' }}
        run: pnpm tsx scripts/write-review.ts --limit ${{ inputs.reviews || '40' }}

  # The catalogue counts are baked into prerendered pages, so a sync that does
  # not redeploy leaves the site quoting yesterday's numbers. It runs even when
  # validation was skipped or failed — the day's new listings still deserve to
  # ship, and their verdicts will land tomorrow.
  deploy:
    needs: [sync, apply]
    if: ${{ always() && needs.sync.result == 'success' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
