name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by sync.yml. A run triggered with the built-in token cannot start
  # another workflow, so the nightly sync has to reuse this one rather than
  # dispatch it — otherwise the site keeps serving the pre-sync numbers.
  workflow_call:

# One deploy at a time. A queued run supersedes an older queued run, but a
# run already pushing to Cloudflare is left alone rather than cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build reads the catalogue from the self-hosted DB, so one dropped
      # connection from the runner failed the whole deploy (23 Nov: connect
      # timeout during "collect page data"). Retry the build once before
      # giving up; a real outage still fails on the second attempt.
      - name: Build
        run: |
          pnpm exec opennextjs-cloudflare build || {
            echo "::warning::build failed; retrying once in 60s"
            sleep 60
            pnpm exec opennextjs-cloudflare build
          }
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Deploy
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # generateStaticParams and the sitemap read the catalog at build
          # time, so the build needs database access, not just the runtime.
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
